<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Harbor — a golden-hour open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a2e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Harbor: top-down open-world crime game. WASD to move and drive, E to enter cars and boats, mouse to aim, F to shoot."></canvas>
<p id="status" role="status" aria-live="polite">Vice Harbor loading</p>
